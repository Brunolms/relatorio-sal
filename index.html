  <h1>Relatório de vendas da SAL</h1>
  <p>Digite a senha de acesso.</p>
  <input id="s" type="password" autocomplete="current-password" placeholder="Senha" autofocus>
  <button>Abrir</button>
  <div id="erro"></div>
</form>
<script>
(() => {
const CHAVE_LOCAL = 'relatorio_sal_senha';
const lembrada = () => { try { return localStorage.getItem(CHAVE_LOCAL); } catch (e) { return null; } };
const guarda = s => { try { localStorage.setItem(CHAVE_LOCAL, s); } catch (e) {} };
const esquece = () => { try { localStorage.removeItem(CHAVE_LOCAL); } catch (e) {} };
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const chaves = {};                                   // reaproveita a chave (derivar leva ~1 s no celular)

async function decifra(senha) {
  const r = await fetch('pagina.json?t=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) throw new Error('indisponivel');
  const p = await r.json();
  const id = senha + '|' + p.sal + '|' + p.it;
  if (!chaves[id]) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    chaves[id] = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(p.sal), iterations: p.it, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  }
  const claro = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(p.iv)}, chaves[id], bytes(p.ct));
  return new TextDecoder().decode(claro);
}

// A página do relatório chama isto a cada minuto para buscar dados/layout novos.
window.__buscaHtml = () => decifra(lembrada() || '');

const erro = t => { document.getElementById('erro').textContent = t; };
async function entrar(senha, lembrar) {
  try {
    const html = await decifra(senha);
    if (lembrar) guarda(senha);
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (e.message === 'indisponivel') erro('Relatório indisponível agora. Tente em instantes.');
    else { esquece(); erro('Senha incorreta.'); }
  }
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  erro('Abrindo...');
  entrar(document.getElementById('s').value, true);
});
if (lembrada()) { erro('Abrindo...'); entrar(lembrada(), false); }
})();
</script>
</body>
</html>
